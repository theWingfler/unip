<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unip Game - Official Website</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
        }

        header {
            padding: 50px 20px;
        }

        h1 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .download-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .download-btn {
            background-color: #0284c7;
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }

        .download-btn:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }

        .gallery {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #334155;
            transition: 0.3s;
        }

        .grid img:hover {
            border-color: #38bdf8;
            transform: scale(1.03);
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Unip Game</h1>
        <p class="subtitle">مرحباً بك في الموقع الرسمي للعبة! حمّل اللعبة واكتشف أحدث الصور واللقطات.</p>
        
        <div class="download-container">
            <!-- استبدل الرابط للـ EXE أو الملف الخاص باللعبة -->
            <a href="#" class="download-btn">🎮 تحميل للـ PC (Windows)</a>
            <a href="#" class="download-btn" style="background-color: #334155;">📱 رابط آخر / قريباً</a>
        </div>
    </header>

    <section class="gallery">
        <h2>لقطات من اللعبة (Screenshots)</h2>
        <div class="grid">
            <!-- استبدل روابط الصور بروابط صور لعبتك أو ارفع الصور لـ GitHub واستخدم اسمها -->
            <img src="https://via.placeholder.com/600x400/1e293b/38bdf8?text=Screenshot+1" alt="Game Screenshot 1">
            <img src="https://via.placeholder.com/600x400/1e293b/38bdf8?text=Screenshot+2" alt="Game Screenshot 2">
            <img src="https://via.placeholder.com/600x400/1e293b/38bdf8?text=Screenshot+3" alt="Game Screenshot 3">
        </div>
    </section>

    <footer>
        <p>© 2026 Unip Game. جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
